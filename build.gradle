plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
    id "io.sentry.jvm.gradle" version "5.6.0"
}

group = 'dev.aikido'
version = '1.0-SNAPSHOT'

java {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation files('zen_by_aikido/zen/agent_api.jar')
    implementation 'io.javalin:javalin:7.2.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    implementation 'org.postgresql:postgresql:42.7.11'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.11'
    implementation 'io.prometheus:prometheus-metrics-core:1.3.6'
    implementation 'io.prometheus:prometheus-metrics-instrumentation-jvm:1.3.6'
    implementation 'io.prometheus:prometheus-metrics-exporter-httpserver:1.3.6'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    constraints {
        implementation('org.jetbrains.kotlin:kotlin-stdlib:2.4.20') {
            because 'AIKIDO-2026-188556, AIKIDO-2026-550292: kotlin-stdlib < 2.4.20 is vulnerable'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-common:2.4.20') {
            because 'AIKIDO-2026-188556, AIKIDO-2026-550292: kotlin-stdlib-common < 2.4.20 is vulnerable'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.4.20') {
            because 'AIKIDO-2026-188556, AIKIDO-2026-550292: kotlin-stdlib-jdk7 < 2.4.20 is vulnerable'
        }
        implementation('org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.4.20') {
            because 'AIKIDO-2026-188556, AIKIDO-2026-550292: kotlin-stdlib-jdk8 < 2.4.20 is vulnerable'
        }
    }
}

test {
    useJUnitPlatform()
}

shadowJar {
    mergeServiceFiles()
    manifest {
        attributes(
                'Main-Class': 'dev.aikido.JavalinPostgres'
        )
    }
}

sentry {
    includeSourceContext = true

    org = "aikido-security-zen-demo-apps"
    projectName = "zen-demo-java"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}
